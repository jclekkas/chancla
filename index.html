<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Chancla Warfare: La Ley de la Chancla</title>
    <meta name="description" content="Doña Rosa versus Doña Rosa: a comedic online team shooter with flying chanclas. Private rooms for 2 to 4 players, practice with bots, free in your browser." />
    <meta name="theme-color" content="#4b2a6b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chancla Warfare" />
    <meta property="og:title" content="Chancla Warfare: La Ley de la Chancla" />
    <meta property="og:description" content="Se acabó la tontería. Team deathmatch with flying chanclas, in your browser." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%og-image.jpg" />
    <style>
      html, body { margin: 0; height: 100%; background: #2e1846; color: #f4e6c8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #f2a33a 0%, #c8553d 45%, #2e1846 100%); z-index: 100; }
      #boot .bt { font: 900 clamp(32px, 7vw, 64px)/1 system-ui, sans-serif; color: #f4e6c8; text-shadow: 0 4px 0 #4b2a6b; text-align: center; }
      #boot .bar { width: min(320px, 70vw); height: 12px; margin: 20px auto 10px; border-radius: 99px; background: rgba(46, 24, 70, 0.6); overflow: hidden; border: 2px solid #f4e6c8; }
      #boot .fill { height: 100%; width: 4%; background: #f4e6c8; transition: width 0.25s ease; }
      #boot .st { font-size: 15px; text-align: center; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <div class="bt">CHANCLA WARFARE</div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4" aria-label="Loading"><div class="fill" id="boot-fill"></div></div>
        <div class="st" id="boot-status">Loading…</div>
        <noscript><p>Chancla Warfare needs JavaScript. Please enable it and reload.</p></noscript>
      </div>
    </div>

    <div id="app" hidden>
      <div id="stage" aria-hidden="true"></div>

      <!-- In-match HUD -->
      <div id="hud" class="hud" hidden>
        <div class="hud-top">
          <div class="teamscore sol"><span class="ts-icon" aria-hidden="true">☀</span><span data-t="hud.sol"></span><b id="sc-sol">0</b></div>
          <div class="timer" id="timer" aria-live="off">5:00</div>
          <div class="teamscore luna"><b id="sc-luna">0</b><span data-t="hud.luna"></span><span class="ts-icon" aria-hidden="true">☾</span></div>
        </div>
        <div class="hud-ident">
          <div class="team-chip" id="team-chip" hidden><span class="tc-icon" id="team-chip-icon" aria-hidden="true"></span><span id="team-chip-text"></span></div>
          <div class="hud-practice" id="hud-practice" hidden data-t="hud.practice"></div>
          <div class="mode-chip" data-t="hud.modeStory"></div>
        </div>
        <div class="spawn-banner" id="spawn-banner" hidden role="status"><span class="sbn-icon" id="spawn-banner-icon" aria-hidden="true"></span><span id="spawn-banner-text"></span></div>
        <div class="killfeed" id="killfeed" aria-live="polite"></div>
        <!-- Touch controls (phones, tablets): shown only while touch is the active input. -->
        <div class="fps-touch" id="fps-touch" hidden>
          <div class="ft-move" id="ft-move"><div class="ft-base" id="ft-base"><div class="ft-knob" id="ft-knob"></div></div><span class="ft-hint" data-t="touch.moveHint"></span></div>
          <div class="ft-pad" aria-label="Movement">
            <button type="button" class="ft-arrow ft-up" data-move-x="0" data-move-z="1" data-t-aria="touch.forward">↑</button>
            <button type="button" class="ft-arrow ft-left" data-move-x="-1" data-move-z="0" data-t-aria="touch.left">←</button>
            <button type="button" class="ft-arrow ft-down" data-move-x="0" data-move-z="-1" data-t-aria="touch.back">↓</button>
            <button type="button" class="ft-arrow ft-right" data-move-x="1" data-move-z="0" data-t-aria="touch.right">→</button>
          </div>
          <div class="ft-look" id="ft-look"><span class="ft-hint" data-t="touch.lookHint"></span></div>
          <button type="button" class="ft-btn ft-throw" id="ft-throw" data-t-aria="touch.throw"><span class="ft-ico" aria-hidden="true"></span><span class="ft-lbl" data-t="touch.throw"></span></button>
          <button type="button" class="ft-btn ft-jump" id="ft-jump" data-t-aria="touch.jump"><span aria-hidden="true">↑</span><span class="ft-lbl" data-t="touch.jump"></span></button>
          <button type="button" class="ft-btn ft-crouch" id="ft-crouch" aria-pressed="false" data-t-aria="touch.crouch"><span aria-hidden="true">↓</span><span class="ft-lbl" data-t="touch.crouch"></span></button>
          <button type="button" class="ft-btn ft-melee" id="ft-melee" data-t-aria="touch.melee"><span class="ft-mico" aria-hidden="true"></span><span class="ft-mlbl" data-t="touch.melee"></span></button>
          <button type="button" class="ft-btn ft-weapon" id="ft-weapon" data-t-aria="touch.weapon"><span aria-hidden="true">⇄</span><span class="ft-lbl" data-t="touch.weapon"></span></button>
          <button type="button" class="ft-btn ft-score" id="ft-score" data-t-aria="touch.scores"><span aria-hidden="true">≡</span><span class="ft-lbl" data-t="touch.scores"></span></button>
        </div>
        <!-- Elimination replay: shown over the replayed scene; the live HUD is hidden meanwhile. -->
        <div class="killcam" id="killcam" hidden>
          <div class="kc-tag" data-t="killcam.replay"></div>
          <div class="kc-by" id="kc-by" aria-live="polite"><span data-t="killcam.by"></span> <b class="kc-name" id="kc-name"></b> <span class="kc-dot" aria-hidden="true">·</span> <span id="kc-attack"></span></div>
          <button type="button" class="kc-skip" id="kc-skip"><span data-t="killcam.skip"></span> <kbd>Space</kbd></button>
          <button type="button" class="kc-tap" id="kc-tap"><span data-t="killcam.tapSkip"></span></button>
        </div>
        <div class="hud-tr">
          <div class="net" id="net"><span class="dot" id="net-dot"></span><span id="net-ping"></span></div>
          <div class="fps" id="fps" hidden></div>
          <button type="button" class="hud-btn menu-btn" id="btn-menu" data-t-aria="hud.menuAria"><span aria-hidden="true">☰</span> <span data-t="hud.pause"></span><span class="menu-key" aria-hidden="true"> · Esc</span></button>
          <div class="esc-hint" id="esc-hint" role="note" data-t="hud.escHint"></div>
        </div>
        <div class="crosshair" id="crosshair" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <circle cx="32" cy="32" r="2.4" class="dot" />
            <path d="M32 14 v8 M32 42 v8 M14 32 h8 M42 32 h8" class="lines" />
            <circle cx="32" cy="32" r="22" class="cd-bg" />
            <circle cx="32" cy="32" r="22" class="cd" id="cd-ring" />
            <g class="hitmarker" id="hitmarker"><path d="M22 22 l6 6 M42 22 l-6 6 M22 42 l6 -6 M42 42 l-6 -6" /></g>
            <g class="missmarker" id="missmarker"><path class="mm-r" d="M44 18 q11 14 0 28 M51 23 q6 9 0 18" /><path class="mm-l" d="M20 18 q-11 14 0 28 M13 23 q-6 9 0 18" /></g>
          </svg>
        </div>
        <div class="dmg-ind" id="dmg-ind" aria-hidden="true"></div>
        <div class="center-msg" id="center-msg" aria-live="assertive" hidden></div>
        <div class="sub-msg" id="sub-msg" aria-live="polite" hidden></div>
        <div class="region" id="region"></div>
        <div class="hud-bl">
          <div class="hp" id="hp" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-t-aria="hud.health">
            <div class="hp-face" aria-hidden="true"></div>
            <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
            <div class="hp-num" id="hp-num">100</div>
          </div>
          <div class="protect" id="protect" hidden data-t="hud.protected"></div>
        </div>
        <div class="weapons" id="weapons">
          <div class="wslot" data-w="0"><span class="wkey">1</span><span class="wicon w0" aria-hidden="true"></span><span class="wname" data-t="hud.weapon0"></span><span class="wmelee"><kbd>V</kbd> <span data-t="melee.chanclazo"></span></span><span class="wcd"><i></i></span></div>
          <div class="wslot" data-w="1"><span class="wkey">2</span><span class="wicon w1" aria-hidden="true"></span><span class="wname" data-t="hud.weapon1"></span><span class="wmelee"><kbd>V</kbd> <span data-t="melee.reves"></span></span><span class="wcd"><i></i></span></div>
        </div>
        <div class="banner-conn" id="banner-conn" hidden role="status"></div>
        <div class="hint" id="hint" data-t="hud.scoreHint"></div>
        <div class="vig hurt" id="vig-hurt" aria-hidden="true"></div>
        <div class="vig low" id="vig-low" aria-hidden="true"></div>
        <div class="names" id="names" aria-hidden="true"></div>
        <div class="m-hud" id="m-hud" hidden>
          <div class="m-obj" id="m-obj" role="status" aria-live="polite">
            <div class="m-title" id="m-title"></div>
            <div class="m-stage" id="m-stage"></div>
            <ul class="m-goals" id="m-goals"></ul>
            <p class="m-next" id="m-next" hidden><b data-t="how.next"></b> <span id="m-next-text"></span></p>
          </div>
          <div class="m-timer" id="m-timer">0:00</div>
          <div class="m-counter" id="m-counter">
            <span class="m-portrait" id="m-portrait" aria-hidden="true"></span>
            <span class="m-curlers" id="m-curlers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <b id="m-count">0/6</b>
          </div>
          <div class="m-boss" id="m-boss" hidden><span id="m-boss-name"></span><b id="m-boss-n"></b><span class="pips" id="m-boss-pips"><i></i><i></i><i></i></span></div>
          <div class="m-arrow" id="m-arrow" hidden aria-hidden="true"></div>
          <div class="m-tip" id="m-tip" hidden role="status"></div>
          <div class="m-cp" id="m-cp" hidden data-t="m.checkpoint"></div>
          <div class="m-ko" id="m-ko" hidden data-t="m.ko"></div>
          <div class="m-skip" id="m-skip" hidden data-t="m.skip"></div>
        </div>
        <div class="subs" id="subs" hidden aria-live="polite"><b id="subs-who"></b> <span id="subs-text"></span></div>
        <div class="zoom-note" id="zoom-note" hidden role="dialog" aria-modal="true" aria-labelledby="zoom-note-title">
          <div class="zn-box" id="zoom-note-box"><div class="panel"><h2 id="zoom-note-title" data-t="touch.zoomTitle"></h2><p data-t="touch.zoomBody"></p></div></div>
        </div>
        <div class="fps-rotate" id="fps-rotate" hidden role="dialog" aria-modal="true" aria-labelledby="fps-rotate-title">
          <div class="panel">
            <div class="rot-ico" aria-hidden="true">⟳</div>
            <h2 id="fps-rotate-title" data-t="touch.rotateTitle"></h2>
            <p id="fps-rotate-body"></p>
            <button type="button" class="btn" id="btn-rotate-menu" data-t="touch.rotateMenu"></button>
          </div>
        </div>
        <div class="click-to-play" id="click-to-play" hidden><div class="ctp-box"><button type="button" class="btn primary" id="btn-click-play" data-t="hud.clickToPlay"></button><p class="ctp-note" id="ctp-note"></p></div></div>
      </div>

      <!-- Scoreboard (hold Tab) -->
      <section class="scoreboard" id="scoreboard" hidden aria-labelledby="sb-title">
        <h2 id="sb-title" data-t="score.title"></h2>
        <div id="sb-body"></div>
      </section>

      <!-- Title -->
      <section id="scr-title" class="screen title" hidden aria-labelledby="logo">
        <div class="title-col">
          <h1 class="logo" id="logo"><span class="logo-main">CHANCLA</span><span class="logo-stamp">WARFARE</span></h1>
          <p class="subtitle" data-t="brand.subtitle"></p>
          <p class="tagline" data-t="brand.tagline"></p>
          <p class="pitch" data-t="brand.pitch"></p>
          <!-- Phones and tablets without a mouse: what works here, and how to get the rest. -->
          <div class="mobile-gate" id="mobile-gate" hidden role="region" aria-labelledby="mg-title">
            <h2 id="mg-title" data-t="mobile.title"></h2>
            <p data-t="mobile.body"></p>
            <button type="button" class="btn primary big" id="btn-mg-online" data-t="mobile.online"></button>
            <button type="button" class="btn big alt" id="btn-mg-practice" data-t="mobile.practice"></button>
            <p class="mg-note" data-t="mobile.onlineNote"></p>
            <a class="btn" id="lnk-touch-arcade" href="/classic.html" data-t="mobile.arcade"></a>
            <h3 data-t="mobile.computer"></h3>
            <button type="button" class="btn" id="btn-copy-link" data-t="mobile.copy"></button>
            <input type="text" class="mg-link" id="mg-link" readonly hidden aria-label="Link" />
            <div class="mg-row">
              <button type="button" class="btn ghost" id="btn-mg-settings" data-t="title.settings"></button>
              <button type="button" class="btn ghost" id="btn-mg-lang" data-t="title.lang" data-t-aria="title.langAria"></button>
              <button type="button" class="btn ghost" id="btn-mg-more" data-t="mobile.more"></button>
            </div>
          </div>
          <div class="title-actions" id="title-actions">
            <button type="button" class="btn primary big needs-pc" id="btn-campaign" data-t="title.campaign"></button>
            <button type="button" class="btn big alt2" id="btn-online" data-t="title.online"></button>
            <button type="button" class="btn big alt" id="btn-practice" data-t="title.practice"></button>
          </div>
          <p class="server-status" id="server-status" role="status"></p>
          <p class="server-status warn" id="webgl-status" hidden role="alert"></p>
          <div class="title-row">
            <button type="button" class="btn ghost" id="btn-controls" data-t="title.controls"></button>
            <button type="button" class="btn ghost" id="btn-settings" data-t="title.settings"></button>
            <button type="button" class="btn ghost" id="btn-lang" data-t="title.lang" data-t-aria="title.langAria"></button>
            <a class="btn ghost" id="lnk-classic" href="/classic.html" data-t="title.classic"></a>
          </div>
          <p class="note" id="mobile-note" hidden data-t="controls.mobile"></p>
        </div>
        <div class="title-side">
          <figure class="rosa-card">
            <div class="rosa-portrait" id="rosa-portrait" role="img" data-t-alt="title.portraitAlt"></div>
            <figcaption><strong data-t="title.rosa"></strong><span data-t="title.rosaBio"></span></figcaption>
          </figure>
        </div>
      </section>

      <!-- Online: name, create, join -->
      <section id="scr-online" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="online-title">
        <div class="panel">
          <h2 id="online-title" data-t="online.title"></h2>
          <label class="field"><span data-t="online.name"></span><input id="in-name" aria-describedby="name-help" enterkeyhint="done" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" data-t-ph="online.namePh" /></label>
          <p class="note name-help" id="name-help" data-t="online.nameHelp"></p>
          <button type="button" class="btn primary" id="btn-create" data-t="online.create"></button>
          <div class="join-row">
            <label class="field grow"><span data-t="online.joinLabel"></span><input id="in-code" type="text" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" data-t-ph="online.codePh" /></label>
            <button type="button" class="btn" id="btn-join" data-t="online.join"></button>
          </div>
          <p class="note" data-t="online.note"></p>
          <p class="err" id="online-err" role="alert"></p>
          <button type="button" class="btn ghost" id="btn-online-back" data-t="online.back"></button>
        </div>
      </section>

      <!-- Practice setup -->
      <section id="scr-practice" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="practice-title">
        <div class="panel practice-panel">
          <h2 id="practice-title" data-t="practice.title"></h2>
          <p class="note" data-t="practice.note"></p>
          <div class="field map-field"><span id="lbl-map" data-t="map.label"></span>
            <div id="practice-maps" aria-labelledby="lbl-map"></div>
          </div>
          <div class="field"><span id="lbl-diff" data-t="practice.difficulty"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-diff">
              <button type="button" role="radio" data-diff="easy" data-t="practice.easy"></button>
              <button type="button" role="radio" data-diff="normal" data-t="practice.normal"></button>
              <button type="button" role="radio" data-diff="hard" data-t="practice.hard"></button>
            </div>
          </div>
          <div class="field"><span id="lbl-allies" data-t="practice.allies"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-allies">
              <button type="button" role="radio" data-allies="0" data-t="practice.none"></button>
              <button type="button" role="radio" data-allies="1" data-t="practice.one"></button>
            </div>
          </div>
          <div class="field"><span id="lbl-enemies" data-t="practice.enemies"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-enemies">
              <button type="button" role="radio" data-enemies="1" data-t="practice.one"></button>
              <button type="button" role="radio" data-enemies="2" data-t="practice.two"></button>
            </div>
          </div>
          <button type="button" class="btn primary" id="btn-practice-start" data-t="practice.start"></button>
          <button type="button" class="btn ghost" id="btn-practice-back" data-t="online.back"></button>
        </div>
      </section>

      <!-- Lobby -->
      <section id="scr-lobby" class="screen overlay lobby" hidden role="dialog" aria-modal="true" aria-labelledby="lobby-title">
        <div class="panel wide">
          <h2 id="lobby-title" data-t="lobby.title"></h2>
          <div class="team-chip big" id="lobby-myteam" hidden role="status"><span class="tc-icon" aria-hidden="true"></span><span class="tc-text"></span></div>
          <div class="codebox" id="codebox">
            <div><span class="label" data-t="lobby.code"></span><strong class="code" id="room-code"></strong></div>
            <div class="codebtns">
              <button type="button" class="btn" id="btn-copy-invite" data-t="lobby.copy"></button>
              <button type="button" class="btn ghost" id="btn-share-invite" data-t="lobby.share" hidden></button>
            </div>
          </div>
          <input class="invite" id="invite-url" readonly aria-label="Invite link" hidden />
          <div class="teams">
            <div class="team sol"><h3><span aria-hidden="true">☀</span> <span data-t="lobby.teamSol"></span></h3><ul id="team-0"></ul></div>
            <div class="team luna"><h3><span aria-hidden="true">☾</span> <span data-t="lobby.teamLuna"></span></h3><ul id="team-1"></ul></div>
          </div>
          <p class="rules" data-t="lobby.rules"></p>
          <div class="field lobby-map"><span id="lbl-lmap" data-t="map.label"></span>
            <div class="seg small" role="radiogroup" aria-labelledby="lbl-lmap">
              <button type="button" role="radio" data-lmap="patio" data-t="map.patio"></button>
              <button type="button" role="radio" data-lmap="plaza" data-t="map.plaza"></button>
              <button type="button" role="radio" data-lmap="fiesta" data-t="map.fiesta"></button>
            </div>
          </div>
          <div class="lobby-owner" id="lobby-owner">
            <label class="field check"><input type="checkbox" id="chk-bots" /><span data-t="lobby.bots"></span></label>
            <div class="seg small" role="radiogroup" aria-labelledby="lbl-diff">
              <button type="button" role="radio" data-bdiff="easy" data-t="practice.easy"></button>
              <button type="button" role="radio" data-bdiff="normal" data-t="practice.normal"></button>
              <button type="button" role="radio" data-bdiff="hard" data-t="practice.hard"></button>
            </div>
            <p class="note" data-t="lobby.botsNote"></p>
          </div>
          <p class="lobby-status" id="lobby-status" role="status"></p>
          <p class="err" id="lobby-err" role="alert"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-start" data-t="lobby.start"></button>
            <button type="button" class="btn primary" id="btn-ready" data-t="lobby.readyBtn"></button>
            <button type="button" class="btn" id="btn-switch" data-t="lobby.switch"></button>
            <button type="button" class="btn ghost" id="btn-lobby-settings" data-t="title.settings"></button>
            <button type="button" class="btn ghost" id="btn-leave-room" data-t="lobby.leave"></button>
          </div>
        </div>
      </section>

      <!-- Results -->
      <!-- Campaign: mission select -->
      <section id="scr-campaign" class="screen overlay campaign" hidden role="dialog" aria-modal="true" aria-labelledby="camp-title">
        <div class="panel wide">
          <h2 id="camp-title" data-t="camp.title"></h2>
          <p class="camp-sub" data-t="camp.subtitle"></p>
          <p class="note" data-t="camp.premise"></p>
          <p class="err" id="camp-storage" hidden data-t="camp.notSaved"></p>
          <p class="lobby-status" id="camp-all" hidden data-t="camp.allDone"></p>
          <div class="missions" id="camp-missions"></div>
          <div class="actions">
            <button type="button" class="btn ghost" id="btn-camp-back" data-t="camp.back"></button>
            <button type="button" class="btn ghost danger-text" id="btn-camp-reset" data-t="camp.reset"></button>
          </div>
        </div>
      </section>

      <!-- Campaign: mission intro -->
      <section id="scr-mintro" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="mi-title">
        <div class="panel wide mintro">
          <p class="label" id="mi-num"></p>
          <h2 id="mi-title"></h2>
          <p id="mi-premise"></p>
          <p class="mi-obj"><b data-t="camp.objective"></b> <span id="mi-objective"></span></p>
          <div class="mi-how"><b data-t="mi.how"></b><ol id="mi-how"></ol><p class="note" id="mi-controls"></p></div>
          <p class="note" id="mi-est"></p>
          <ul class="ch-list" id="mi-ch"></ul>
          <p class="note" id="mi-status" role="status"></p>
          <button type="button" class="btn" id="btn-mi-reload" data-t="crash.reload" hidden></button>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-mi-start" data-t="mi.start"></button>
            <button type="button" class="btn ghost" id="btn-mi-back" data-t="camp.back"></button>
          </div>
        </div>
      </section>

      <!-- Campaign: mission results -->
      <section id="scr-mresults" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="mr-title">
        <div class="panel wide">
          <h2 id="mr-title" data-t="mr.title"></h2>
          <p class="res-sub" id="mr-name"></p>
          <div class="mr-portrait" id="mr-portrait" role="img"></div>
          <p class="lobby-status" id="mr-best"></p>
          <dl class="mr-stats" id="mr-stats"></dl>
          <h3 data-t="camp.challenges"></h3>
          <ul class="ch-list" id="mr-ch"></ul>
          <p class="note" id="mr-final" hidden data-t="mr.final"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-mr-next" data-t="mr.next"></button>
            <button type="button" class="btn" id="btn-mr-retry" data-t="mr.retry"></button>
            <button type="button" class="btn ghost" id="btn-mr-select" data-t="mr.select"></button>
            <button type="button" class="btn ghost" id="btn-mr-home" data-t="pause.home"></button>
          </div>
        </div>
      </section>

      <section id="scr-results" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="res-title">
        <div class="panel wide">
          <h2 id="res-title"></h2>
          <div class="team-chip big" id="res-myteam" hidden><span class="tc-icon" aria-hidden="true"></span><span class="tc-text"></span></div>
          <p class="res-sub" id="res-sub"></p>
          <div class="res-score"><span class="sol" id="res-sol">0</span><span class="vs">–</span><span class="luna" id="res-luna">0</span></div>
          <div id="res-table"></div>
          <p class="lobby-status" id="res-status"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-rematch" data-t="results.rematch"></button>
            <button type="button" class="btn" id="btn-to-lobby" data-t="results.lobby"></button>
            <button type="button" class="btn" id="btn-res-maps" data-t="results.maps" hidden></button>
            <button type="button" class="btn ghost" id="btn-res-leave" data-t="results.home"></button>
          </div>
        </div>
      </section>

      <!-- In-match menu -->
      <section id="scr-pause" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="panel">
          <h2 id="pause-title" data-t="pause.title"></h2>
          <p class="note" id="pause-note"></p>
          <p class="note build-note" id="pause-build"></p>
          <button type="button" class="btn primary" id="btn-resume" data-t="pause.resume"></button>
          <button type="button" class="btn" id="btn-pause-settings" data-t="pause.settings"></button>
          <button type="button" class="btn" id="btn-pause-controls" data-t="pause.controls"></button>
          <button type="button" class="btn" id="btn-fullscreen" data-t="pause.fullscreen"></button>
          <button type="button" class="btn" id="btn-pause-retrycp" data-t="pause.retryCp" hidden></button>
          <button type="button" class="btn" id="btn-pause-restart" data-t="pause.restart" hidden></button>
          <button type="button" class="btn" id="btn-pause-maps" data-t="pause.maps" hidden></button>
          <button type="button" class="btn" id="btn-pause-select" data-t="pause.select" hidden></button>
          <button type="button" class="btn ghost" id="btn-pause-diag" data-t="diag.copy"></button>
          <button type="button" class="btn ghost" id="btn-pause-leave" data-t="pause.home"></button>
        </div>
      </section>

      <!-- Settings -->
      <section id="scr-settings" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="panel settings">
          <h2 id="settings-title" data-t="settings.title"></h2>
          <p class="note build-row"><span id="build-id"></span> <button type="button" class="btn ghost small" id="btn-settings-diag" data-t="diag.copy"></button></p>
          <p class="note sound-status" id="sound-status" role="status"></p>
          <div class="field"><span id="lbl-lang" data-t="settings.language"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-lang">
              <button type="button" role="radio" data-lang="en">English</button>
              <button type="button" role="radio" data-lang="es">Español</button>
            </div>
          </div>
          <label class="field"><span data-t="settings.sensitivity"></span><input type="range" id="set-sens" min="10" max="400" step="5" /><output id="out-sens"></output></label>
          <label class="field touch-setting"><span data-t="settings.touchSensitivity"></span><input type="range" id="set-tsens" min="30" max="300" step="5" /><output id="out-tsens"></output></label>
          <label class="field check"><input type="checkbox" id="set-invert" /><span data-t="settings.invertY"></span></label>
          <label class="field"><span data-t="settings.fov"></span><input type="range" id="set-fov" min="70" max="105" step="1" /><output id="out-fov"></output></label>
          <label class="field check"><input type="checkbox" id="set-motion" /><span data-t="settings.reducedMotion"></span></label>
          <div class="field"><span id="lbl-q" data-t="settings.quality"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-q">
              <button type="button" role="radio" data-q="auto" data-t="settings.auto"></button>
              <button type="button" role="radio" data-q="low" data-t="settings.low"></button>
              <button type="button" role="radio" data-q="medium" data-t="settings.medium"></button>
              <button type="button" role="radio" data-q="high" data-t="settings.high"></button>
            </div>
          </div>
          <label class="field"><span data-t="settings.music"></span><input type="range" id="set-music" min="0" max="100" step="1" /><output id="out-music"></output></label>
          <div class="field" id="soundtrack"></div>
          <label class="field"><span data-t="settings.sfx"></span><input type="range" id="set-sfx" min="0" max="100" step="1" /><output id="out-sfx"></output></label>
          <label class="field"><span data-t="settings.voice"></span><input type="range" id="set-voice" min="0" max="100" step="1" /><output id="out-voice"></output></label>
          <label class="field check"><input type="checkbox" id="set-banter" /><span data-t="settings.banter"></span></label>
          <div class="field"><span id="lbl-subs" data-t="settings.subtitles"></span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-subs">
              <button type="button" role="radio" data-subs="auto" data-t="settings.subAuto"></button>
              <button type="button" role="radio" data-subs="es">Español</button>
              <button type="button" role="radio" data-subs="en">English</button>
              <button type="button" role="radio" data-subs="off" data-t="settings.subOff"></button>
            </div>
          </div>
          <label class="field check"><input type="checkbox" id="set-hints" /><span data-t="settings.hints"></span></label>
          <p class="note" data-t="settings.voiceNote"></p>
          <label class="field check"><input type="checkbox" id="set-killcam" /><span data-t="settings.killcam"></span></label>
          <label class="field check"><input type="checkbox" id="set-stats" /><span data-t="settings.showStats"></span></label>
          <button type="button" class="btn primary" id="btn-settings-close" data-t="settings.close"></button>
        </div>
      </section>

      <!-- Controls -->
      <section id="scr-controls" class="screen overlay" hidden role="dialog" aria-modal="true" aria-labelledby="controls-title">
        <div class="panel">
          <h2 id="controls-title" data-t="controls.title"></h2>
          <dl class="controls touch-list">
            <dt data-t="controls.tMove"></dt><dd data-t="controls.move"></dd>
            <dt data-t="controls.tLook"></dt><dd data-t="controls.look"></dd>
            <dt data-t="controls.tThrow"></dt><dd data-t="controls.throw"></dd>
            <dt data-t="controls.tMelee"></dt><dd data-t="controls.melee"></dd>
            <dt data-t="controls.tJump"></dt><dd data-t="controls.jump"></dd>
            <dt data-t="controls.tCrouch"></dt><dd data-t="controls.crouch"></dd>
            <dt data-t="controls.tWeapon"></dt><dd data-t="controls.weapon"></dd>
            <dt data-t="controls.tScores"></dt><dd data-t="controls.scores"></dd>
            <dt data-t="controls.tMenu"></dt><dd data-t="controls.tMenuWhat"></dd>
          </dl>
          <dl class="controls key-list">
            <dt data-t="controls.kMove"></dt><dd data-t="controls.move"></dd>
            <dt data-t="controls.kLook"></dt><dd data-t="controls.look"></dd>
            <dt data-t="controls.kThrow"></dt><dd data-t="controls.throw"></dd>
            <dt data-t="controls.kMelee"></dt><dd data-t="controls.melee"></dd>
            <dt data-t="controls.kJump"></dt><dd data-t="controls.jump"></dd>
            <dt data-t="controls.kCrouch"></dt><dd data-t="controls.crouch"></dd>
            <dt data-t="controls.kWeapon"></dt><dd data-t="controls.weapon"></dd>
            <dt data-t="controls.kScores"></dt><dd data-t="controls.scores"></dd>
            <dt data-t="controls.kMenu"></dt><dd data-t="controls.menu"></dd>
          </dl>
          <div class="weapon-cards">
            <div><span class="wicon w0" aria-hidden="true"></span><b data-t="hud.weapon0"></b><span data-t="hud.weapon0Desc"></span></div>
            <div><span class="wicon w1" aria-hidden="true"></span><b data-t="hud.weapon1"></b><span data-t="hud.weapon1Desc"></span></div>
          </div>
          <p class="note" data-t="controls.tip"></p>
          <p class="note" data-t="controls.meleeTip"></p>
          <button type="button" class="btn primary" id="btn-controls-close" data-t="settings.close"></button>
        </div>
      </section>

      <!-- Confirm leave -->
      <section id="scr-confirm" class="screen overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
        <div class="panel">
          <h2 id="confirm-title" data-t="confirm.leaveTitle"></h2>
          <p id="confirm-body"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-confirm-no" data-t="confirm.no"></button>
            <button type="button" class="btn danger" id="btn-confirm-yes" data-t="confirm.yes"></button>
          </div>
        </div>
      </section>

      <!-- The picture stopped (frames keep failing) -->
      <section id="scr-crash" class="screen overlay sys" hidden role="alertdialog" aria-modal="true" aria-labelledby="crash-title" aria-describedby="crash-body">
        <div class="panel">
          <h2 id="crash-title" data-t="crash.title"></h2>
          <p id="crash-body" data-t="crash.body"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-crash-diag" data-t="diag.copy"></button>
            <button type="button" class="btn" id="btn-crash-home" data-t="crash.home"></button>
            <button type="button" class="btn ghost" id="btn-crash-reload" data-t="crash.reload"></button>
          </div>
        </div>
      </section>

      <!-- WebGL context lost -->
      <section id="scr-gfx" class="screen overlay sys" hidden role="alertdialog" aria-modal="true" aria-labelledby="gfx-title" aria-describedby="gfx-body">
        <div class="panel">
          <h2 id="gfx-title" data-t="gfx.title"></h2>
          <p id="gfx-body"></p>
          <p class="note" id="gfx-slow" data-t="gfx.slow" hidden></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-gfx-reload" data-t="crash.reload"></button>
            <button type="button" class="btn ghost" id="btn-gfx-diag" data-t="diag.copy"></button>
          </div>
        </div>
      </section>

      <!-- Copy fallback: the text, selectable -->
      <section id="scr-diagbox" class="screen overlay sys" hidden role="dialog" aria-modal="true" aria-labelledby="diagbox-title">
        <div class="panel wide">
          <h2 id="diagbox-title" data-t="diag.copy"></h2>
          <p class="note" data-t="diag.manual"></p>
          <textarea id="diagbox-text" class="diag-text" readonly rows="12" aria-labelledby="diagbox-title"></textarea>
          <button type="button" class="btn primary" id="btn-diagbox-close" data-t="settings.close"></button>
        </div>
      </section>

      <!-- Connection lost -->
      <section id="scr-lost" class="screen overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="lost-title" aria-describedby="lost-body">
        <div class="panel">
          <h2 id="lost-title" data-t="lost.title"></h2>
          <p id="lost-body"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-lost-retry" data-t="lost.retry"></button>
            <button type="button" class="btn" id="btn-lost-practice" data-t="lost.practice"></button>
            <button type="button" class="btn ghost" id="btn-lost-title" data-t="lost.title2"></button>
            <button type="button" class="btn ghost" id="btn-lost-diag" data-t="diag.copy"></button>
          </div>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/fps/main.ts"></script>
  </body>
</html>
